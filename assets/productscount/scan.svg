<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-label="Phone scanning a barcode">
<defs>
  <linearGradient id="box" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3b04b"/><stop offset="1" stop-color="#c98f2c"/></linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b47d22"/><stop offset="1" stop-color="#9a6a1c"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4d4d" stop-opacity=".05"/><stop offset="1" stop-color="#ff4d4d" stop-opacity=".35"/></linearGradient>
  <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3b39"/><stop offset="1" stop-color="#1b2523"/></linearGradient>
  <clipPath id="scr"><rect x="44" y="52" width="132" height="246" rx="14"/></clipPath>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#04201d" flood-opacity=".35"/></filter>
</defs>

<!-- soft floor shadow -->
<ellipse cx="300" cy="318" rx="92" ry="10" fill="#04201d" opacity=".18"/>

<!-- product carton -->
<g filter="url(#sh)">
  <polygon points="372,96 392,82 392,300 372,314" fill="url(#side)"/>
  <polygon points="228,96 248,82 392,82 372,96" fill="#f0c873"/>
  <rect x="228" y="96" width="144" height="218" rx="4" fill="url(#box)"/>
  <rect x="244" y="116" width="112" height="38" rx="8" fill="#0a4640"/>
  <rect x="256" y="128" width="62" height="6" rx="3" fill="#e3b04b"/>
  <rect x="256" y="140" width="40" height="5" rx="2.5" fill="#7fb5ac"/>
  <circle cx="300" cy="196" r="22" fill="#fff" opacity=".85"/>
  <circle cx="300" cy="196" r="13" fill="#13675d"/>
  <!-- barcode label -->
  <rect x="250" y="238" width="100" height="58" rx="5" fill="#fff"/>
  <rect x="258.00" y="245" width="0.83" height="42" fill="#111"/>
<rect x="259.66" y="245" width="0.83" height="42" fill="#111"/>
<rect x="262.16" y="245" width="0.83" height="36" fill="#111"/>
<rect x="264.65" y="245" width="2.50" height="36" fill="#111"/>
<rect x="267.98" y="245" width="0.83" height="36" fill="#111"/>
<rect x="271.31" y="245" width="0.83" height="36" fill="#111"/>
<rect x="273.80" y="245" width="2.50" height="36" fill="#111"/>
<rect x="277.13" y="245" width="2.50" height="36" fill="#111"/>
<rect x="280.46" y="245" width="0.83" height="36" fill="#111"/>
<rect x="282.12" y="245" width="1.66" height="36" fill="#111"/>
<rect x="285.45" y="245" width="0.83" height="36" fill="#111"/>
<rect x="287.11" y="245" width="0.83" height="36" fill="#111"/>
<rect x="290.44" y="245" width="1.66" height="36" fill="#111"/>
<rect x="292.93" y="245" width="2.50" height="36" fill="#111"/>
<rect x="296.26" y="245" width="0.83" height="42" fill="#111"/>
<rect x="297.92" y="245" width="0.83" height="42" fill="#111"/>
<rect x="299.58" y="245" width="0.83" height="36" fill="#111"/>
<rect x="301.25" y="245" width="2.50" height="36" fill="#111"/>
<rect x="306.24" y="245" width="2.50" height="36" fill="#111"/>
<rect x="309.56" y="245" width="2.50" height="36" fill="#111"/>
<rect x="314.55" y="245" width="1.66" height="36" fill="#111"/>
<rect x="317.05" y="245" width="0.83" height="36" fill="#111"/>
<rect x="318.71" y="245" width="2.50" height="36" fill="#111"/>
<rect x="322.04" y="245" width="1.66" height="36" fill="#111"/>
<rect x="325.37" y="245" width="0.83" height="36" fill="#111"/>
<rect x="328.69" y="245" width="0.83" height="36" fill="#111"/>
<rect x="332.02" y="245" width="1.66" height="36" fill="#111"/>
<rect x="336.18" y="245" width="2.50" height="36" fill="#111"/>
<rect x="339.50" y="245" width="0.83" height="42" fill="#111"/>
<rect x="341.17" y="245" width="0.83" height="42" fill="#111"/>
</g>

<!-- scan beam from phone to the barcode -->
<polygon points="176,150 176,200 252,292 252,240" fill="url(#beam)">
  <animate attributeName="opacity" values=".55;1;.55" dur="1.6s" repeatCount="indefinite"/>
</polygon>
<line x1="250" y1="266" x2="350" y2="266" stroke="#ff2b2b" stroke-width="2.5" stroke-linecap="round">
  <animate attributeName="y1" values="246;286;246" dur="1.6s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="246;286;246" dur="1.6s" repeatCount="indefinite"/>
</line>

<!-- phone -->
<g filter="url(#sh)">
  <rect x="32" y="30" width="156" height="290" rx="26" fill="#0d1a18"/>
  <rect x="35" y="33" width="150" height="284" rx="23" fill="#1f2c2a"/>
  <rect x="44" y="52" width="132" height="246" rx="14" fill="url(#cam)"/>
  <g clip-path="url(#scr)">
    <!-- app bar -->
    <rect x="44" y="52" width="132" height="30" fill="#0a4640"/>
    <rect x="56" y="63" width="54" height="8" rx="4" fill="#ffffff" opacity=".9"/>
    <circle cx="160" cy="67" r="6" fill="#e3b04b"/>
    <!-- camera view: the product label, zoomed -->
    <rect x="44" y="82" width="132" height="168" fill="#c98f2c" opacity=".55"/>
    <rect x="58" y="128" width="104" height="70" rx="6" fill="#fff"/>
    <rect x="66.00" y="136" width="0.81" height="52" fill="#111"/>
<rect x="67.63" y="136" width="0.81" height="52" fill="#111"/>
<rect x="69.26" y="136" width="2.44" height="46" fill="#111"/>
<rect x="74.15" y="136" width="2.44" height="46" fill="#111"/>
<rect x="77.41" y="136" width="1.63" height="46" fill="#111"/>
<rect x="79.85" y="136" width="2.44" height="46" fill="#111"/>
<rect x="84.74" y="136" width="0.81" height="46" fill="#111"/>
<rect x="88.00" y="136" width="0.81" height="46" fill="#111"/>
<rect x="91.26" y="136" width="0.81" height="46" fill="#111"/>
<rect x="93.70" y="136" width="2.44" height="46" fill="#111"/>
<rect x="98.59" y="136" width="1.63" height="46" fill="#111"/>
<rect x="101.85" y="136" width="1.63" height="46" fill="#111"/>
<rect x="105.93" y="136" width="1.63" height="46" fill="#111"/>
<rect x="109.19" y="136" width="1.63" height="46" fill="#111"/>
<rect x="111.63" y="136" width="0.81" height="52" fill="#111"/>
<rect x="113.26" y="136" width="0.81" height="52" fill="#111"/>
<rect x="114.89" y="136" width="0.81" height="46" fill="#111"/>
<rect x="116.52" y="136" width="2.44" height="46" fill="#111"/>
<rect x="119.78" y="136" width="0.81" height="46" fill="#111"/>
<rect x="123.04" y="136" width="1.63" height="46" fill="#111"/>
<rect x="127.11" y="136" width="1.63" height="46" fill="#111"/>
<rect x="130.37" y="136" width="2.44" height="46" fill="#111"/>
<rect x="134.44" y="136" width="1.63" height="46" fill="#111"/>
<rect x="138.52" y="136" width="0.81" height="46" fill="#111"/>
<rect x="140.15" y="136" width="2.44" height="46" fill="#111"/>
<rect x="144.22" y="136" width="0.81" height="46" fill="#111"/>
<rect x="146.67" y="136" width="0.81" height="46" fill="#111"/>
<rect x="149.11" y="136" width="1.63" height="46" fill="#111"/>
<rect x="151.56" y="136" width="0.81" height="52" fill="#111"/>
<rect x="153.19" y="136" width="0.81" height="52" fill="#111"/>
    <!-- scan frame corners -->
    <g stroke="#e3b04b" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M54 124 v-12 h14"/><path d="M166 124 v-12 h-14"/>
      <path d="M54 204 v12 h14"/><path d="M166 204 v12 h-14"/>
    </g>
    <line x1="58" y1="160" x2="162" y2="160" stroke="#ff2b2b" stroke-width="2.5">
      <animate attributeName="y1" values="134;192;134" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="134;192;134" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <!-- result card -->
    <rect x="52" y="256" width="116" height="34" rx="9" fill="#ffffff"/>
    <circle cx="68" cy="273" r="9" fill="#1fa463"/>
    <path d="M63.5 273 l3.2 3.2 l6 -6.4" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="84" y="265" width="70" height="6" rx="3" fill="#0a3b36"/>
    <rect x="84" y="276" width="46" height="5" rx="2.5" fill="#9aa9a5"/>
  </g>
  <rect x="88" y="39" width="44" height="7" rx="3.5" fill="#0d1a18"/>
</g>
</svg>
